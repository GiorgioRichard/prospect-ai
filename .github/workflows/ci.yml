name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # Container efêmero do CI; não é credencial real.
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://prospect_owner:ci-owner@localhost:5432/prospect_ai_test
      TEST_APP_DATABASE_URL: postgresql://app_user:ci-app@localhost:5432/prospect_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Bootstrap roles e banco de teste
        env:
          PGPASSWORD: ci-superuser
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -v owner_pw=ci-owner -v app_pw=ci-app -f packages/db/sql/bootstrap-local.sql
      - name: Migrações no banco de teste
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

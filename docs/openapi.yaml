openapi: 3.1.0
info:
  title: Prospect AI API
  version: 0.2.0
  description: >
    Contratos v1 implementados até o E02 (auth/workspace/RBAC). Fonte de verdade dos
    schemas: packages/contracts (Zod). Regras gerais em docs/API.md.
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Verificação de vida
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { const: ok } } }
  /v1/workspaces:
    get:
      summary: Lista workspaces do usuário autenticado
      parameters: [{ $ref: "#/components/parameters/cursor" }, { $ref: "#/components/parameters/limit" }]
      responses:
        "200":
          description: Página de workspaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspacePage" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Cria workspace; o criador vira OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: { name: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{workspaceId}:
    parameters: [{ $ref: "#/components/parameters/workspaceId" }]
    get:
      summary: Detalhe do workspace (404 se o usuário não for membro)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{workspaceId}/members:
    parameters: [{ $ref: "#/components/parameters/workspaceId" }]
    get:
      summary: Lista membros (qualquer papel)
      parameters: [{ $ref: "#/components/parameters/cursor" }, { $ref: "#/components/parameters/limit" }]
      responses:
        "200":
          description: Página de membros
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Adiciona membro por userId (OWNER; ADMIN apenas MEMBER/VIEWER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, role]
              properties:
                userId: { type: string, format: uuid }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Adicionado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{workspaceId}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/workspaceId" }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Altera papel (409 se rebaixar o último OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties: { role: { $ref: "#/components/schemas/Role" } }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove membro; qualquer membro pode sair (409 se for o último OWNER)
      responses:
        "204": { description: Removido }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT do Supabase Auth (ES256/RS256 via JWKS); valida issuer, audience e exp.
  parameters:
    workspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    cursor: { name: cursor, in: query, required: false, schema: { type: string, maxLength: 200 } }
    limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    Error:
      description: Envelope de erro
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Role: { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER] }
    Workspace:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
    WorkspacePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Workspace" } }
        nextCursor: { type: [string, "null"] }
    Member:
      type: object
      required: [userId, role, createdAt]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
    MemberPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Member" } }
        nextCursor: { type: [string, "null"] }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, INVALID_INPUT, QUOTA_EXCEEDED, PROVIDER_UNAVAILABLE, INTERNAL]
        message: { type: string }
        requestId: { type: string, format: uuid }
        details: {}
